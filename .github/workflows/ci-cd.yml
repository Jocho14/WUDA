name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install bandit flake8 pytest
          if [ -f back-end/requirements.txt ]; then pip install -r back-end/requirements.txt; fi
          if [ -f front-end/requirements.txt ]; then pip install -r front-end/requirements.txt; fi

      - name: Run vulnerability scan
        run: |
          echo "Scanning backend..."
          bandit -r back-end -ll || true
          echo "Scanning frontend..."
          bandit -r front-end -ll || true

      - name: Run code linting
        run: |
          echo "Linting backend..."
          flake8 back-end --count --max-complexity=10 --max-line-length=120 --statistics
          echo "Linting frontend..."
          flake8 front-end --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          pytest back-end --maxfail=1 --disable-warnings -q
          pytest front-end --maxfail=1 --disable-warnings -q
