services:
  postgres:
    image: postgres:${POSTGRES_TAG:-latest}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Backend 
  backend:
    build: ./back-end
    ports:
      - "${APP_PORT_BACKEND:-5000}:5000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_KEY=${JWT_KEY}
      - APP_PORT=5000
      - APP_HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 
    depends_on:
      - postgres
      - otel-collector
  
  # Front 
  frontend:
    build: ./front-end
    ports:
      - "${APP_PORT_FRONTEND:-8000}:8000"
    environment:
      - BACKEND_HOSTNAME=backend
      - BACKEND_PORT=5000
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - SECRET_KEY=${SECRET_KEY_FRONTEND}
    depends_on:
      - backend

  # Zbieranie statystyk 
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_TAG:-latest}
    # etc -> bo to domyślna ścieżka więc musi tak być 
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - postgres

  # Prometeusz
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    # etc -> bo to domyślna ścieżka więc musi tak być
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # Grafana
  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
