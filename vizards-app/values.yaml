backend:
  image:
    repository: ealen/echo-server
    tag: "latest"
  replicaCount: 1
  service:
    port: 80
  env:
    DATABASE_HOST: "vizards-database"
    DATABASE_PORT: "5432"
    DATABASE_NAME: "wudadb"
    DATABASE_USER: "postgres"
    DATABASE_PASSWORD: "change-me"

frontend:
  image:
    repository: "nginx"
    tag: "1.23"
  replicaCount: 2
  service:
    type: NodePort
    port: 80

database:
  enabled: true
  image:
    repository: "postgres"
    tag: "15.0"
  replicaCount: 1
  env:
    POSTGRES_DB: "wudadb"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "change-me"
