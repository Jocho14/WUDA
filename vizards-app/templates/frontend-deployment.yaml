apiVersion: apps/v1
kind: Deployment
metadata:
  name: vizards-frontend
  labels:
    app: frontend
spec:
  replicas: {{.Values.frontend.replicaCount}}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          args: ["flask", "run", "--host=0.0.0.0", "--port=8000"]
          ports:
            - containerPort: {{.Values.frontend.service.port}}
          env:
            - name: BACKEND_HOSTNAME
              value: "vizards-backend"
            - name: BACKEND_PORT
              value: "{{ .Values.backend.service.port }}"
          livenessProbe:
            httpGet:
              path: /
              port: {{.Values.frontend.service.port}}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{.Values.frontend.service.port}}
